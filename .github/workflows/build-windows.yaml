name: build-and-test-windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    # zig cc is the compiler (no MSYS2 gcc). Zig's native Windows target is
    # the msvc ABI, which looks for gtk-4.lib and never libgtk-4.dll.a — the
    # MSYS2 stack is MinGW, so pin the gnu target explicitly. pkgconf also
    # suppresses /mingw64/{include,lib} as "system" dirs that zig does not
    # search on its own — the two PKG_CONFIG vars disable that.
    env:
      CC: zig cc -target x86_64-windows-gnu
      SAN_CC: zig cc -target x86_64-windows-gnu
      PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
      PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-cjson
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-vulkan-loader

      - run: make deps-check
      - run: make info
      - run: make release
      - run: make debug
      - run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: requesthub-windows-x86_64
          path: build/release/requesthub.exe
