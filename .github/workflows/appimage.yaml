name: appimage

on:
  push:
    branches:
      - master
      - development
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.2); empty builds the artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04

    # Set when a v* tag is pushed OR when dispatched with a tag input; in the
    # second case the release step creates the tag at the built commit.
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # full history so git describe produces the AppImage version
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libxml2-dev \
            libyaml-dev \
            libcjson-dev \
            libcurl4-openssl-dev \
            libglib2.0-dev

      - name: Build AppImage
        run: |
          if [ -n "${RELEASE_TAG}" ]; then
            make appimage VERSION="${RELEASE_TAG}"
          else
            make appimage
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: RequestHub-AppImage-x86_64
          path: build/RequestHub-*.AppImage

      - name: Create release and attach the AppImage
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: build/RequestHub-*.AppImage
          generate_release_notes: true
