name: appimage

on:
  push:
    branches:
      - master
      - development
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # full history so git describe produces the AppImage version
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            wget \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            libxml2-dev \
            libyaml-dev \
            libcjson-dev \
            libcurl4-openssl-dev \
            libglib2.0-dev

      - run: make appimage

      - uses: actions/upload-artifact@v4
        with:
          name: RequestHub-AppImage-x86_64
          path: build/RequestHub-*.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/RequestHub-*.AppImage
          generate_release_notes: true
